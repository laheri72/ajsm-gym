        <script>
        // This script runs instantly, before anything is displayed.
        try {
            const userString = localStorage.getItem('staffUser');
            if (userString) {
                const user = JSON.parse(userString);
                const classList = [];

                if (user.Role === 'Admin') {
                    classList.push('is-admin');
                }
                if (user.Branch === 'Marol' && user.Gender === 'Male') {
                    classList.push('is-marol-male');
                }

                if (classList.length > 0) {
                    document.documentElement.className = classList.join(' ');
                }
            }
        } catch (e) {
            // If something fails, do nothing and let the main script handle it.
            console.error('Bootstrap script failed:', e);
        }
    </script>

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.45/moment-timezone-with-data.min.js"></script>

    <style>
        :root {
            --primary-color: #10b981;
            --primary-hover: #059669;
            --secondary-color: #f3f4f6;
            --text-color: #374151;
            --border-color: #d1d5db;
            --card-bg: #ffffff;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-blur: blur(10px);
        }

        body.dark-mode {
            --secondary-color: #1f2937;
            --text-color: #e5e7eb;
            --border-color: #4b5563;
            --card-bg: #374151;
            --glass-bg: rgba(55, 65, 81, 0.8);
            --success-bg: #065f46;
            --success-text: #d1fae5;
            --error-bg: #991b1b;
            --error-text: #fee2e2;
        }

        body.dark-mode #quick-stats p {
            color: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0 0 60px 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .content {
            padding: 1rem;
            max-width: 100%;
            margin: 0 auto;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        h2, h3, h4 {
            margin-top: 0;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-text {
            vertical-align: middle;
        }

        .search-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            position: relative; /* Ensure proper stacking context */
            z-index: 1; /* Ensure it's above other elements */
        }

        .search-group .form-control {
            flex-grow: 1;
        }

        .search-group .btn {
            width: auto;
            padding: 0.75rem 1.5rem;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 0.5rem 0;
            box-shadow: var(--shadow);
            z-index: 1000;
        }

        .nav-link {
            color: var(--text-color);
            text-decoration: none;
            text-align: center;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: color 0.2s;
        }

        .nav-link.active {
            color: var(--primary-color);
        }

        .nav-link i {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .accordion-item {
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .accordion-header {
            background: var(--card-bg);
            padding: 1rem;
            cursor: pointer;
            color: var(--text-color);
        }

        .accordion-body {
            padding: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        .swal2-html-container {
            overflow: initial !important;
        }

        .body-parts-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }

        .body-part-chip {
            padding: 10px 18px;
            border-radius: 20px;
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            user-select: none;
            color: var(--text-color);
        }

        .body-part-chip:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .body-part-chip.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-hover);
        }

        #max-selection-warning {
            color: var(--error-text);
            font-size: 0.9em;
            height: 1.2em;
            margin-top: 10px;
            transition: opacity 0.2s ease;
        }

        .hidden {
            display: none;
        }

        .mini-profile-modal .modal-content {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-radius: 12px;
        }

        .mini-profile-modal .profile-info {
            padding: 1rem;
            text-align: center;
        }

        .mini-profile-modal .profile-info p {
            margin: 0.5rem 0;
            font-size: 1rem;
            color: var(--text-color);
        }

        .mini-profile-modal .recent-activity {
            background: var(--card-bg);
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .mini-profile-modal .action-buttons {
            display: flex;
            gap: 1rem;
            padding: 1rem;
        }

        .list-group-item-action {
            color: var(--text-color);
            background-color: var(--card-bg);
            border-color: var(--border-color);
            transition: background-color 0.2s, color 0.2s;
        }

        .list-group-item-action:hover {
            background-color: var(--secondary-color);
        }

        .list-group-item-action.text-danger {
            color: #dc3545 !important;
        }

        .list-group-item-action.text-danger:hover {
            background-color: #f8d7da;
        }

        .choices__list--dropdown {
            z-index: 5000;
            position: relative;
            color: var(--text-color);
            background-color: var(--card-bg);
        }

        .choices__list--dropdown .choices__item--selectable.is-highlighted {
            background-color: var(--secondary-color);
        }
        /* Inside your <style> block */

        #student-search-card {
            position: relative; /* This is required for z-index to work */
            z-index: 2;         /* A higher number means it's on top */
        }

        #daily-attendance-card {
            position: relative;
            z-index: 1;         /* A lower number means it's underneath */
        }
        /* Inside your <style> block, can be placed at the end */
        
            
        body.dark-mode .choices__inner {
            background-color: var(--card-bg);
            border-color: var(--border-color);
        }

        body.dark-mode .choices__list--dropdown {
            background-color: var(--card-bg);
            border-color: var(--border-color);
        }

        body.dark-mode .choices__item {
            color: var(--text-color);
        }

        body.dark-mode .choices__list--dropdown .choices__item--selectable.is-highlighted {
            background-color: var(--secondary-color);
        }
        /* ... inside your <style> block ... */

        #testing-area {
            display: flex;
            flex-wrap: nowrap;
            gap: 1rem;
            overflow-x: auto;
            padding: 1rem 0.5rem; /* Add padding for scrollbar */
            min-height: 200px; /* Ensure it has some space */
        }

        #testing-area .accordion-item {
            flex: 0 0 300px; /* Don't grow, don't shrink, base width 300px */
            margin-bottom: 0; /* Override default margin */
        }
        /* Inside your <style> block */

.search-group .choices {
    flex-grow: 1;  /* This tells the element to fill the available space */
    width: 1%;     /* This is a flexbox trick to ensure 'flex-grow' works properly */
}
    </style>

</head>
<body>
<main class="content" id="main-content">
    <!-- Dynamic content will be rendered here -->
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-link active" data-page="home">
        <i class="fas fa-home"></i> <span>Home</span>
    </a>
    <a href="#" class="nav-link" data-page="checkout">
        <i class="fas fa-door-open"></i> <span>Check-out</span>
    </a>
    <a href="#" class="nav-link" data-page="test" id="nav-fitness-test">
        <i class="fas fa-dumbbell"></i> <span>Fitness Test</span>

    <a href="#" class="nav-link" data-page="menu">
        <i class="fas fa-bars"></i> <span>Menu</span>

<!-- Student Mini Profile Modal -->
<div class="modal fade mini-profile-modal" id="studentMiniProfileModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Student Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="profile-info">
                    <p><strong>Name:</strong> <span id="profile-name"></span></p>
                    <p><strong>TR:</strong> <span id="profile-tr"></span></p>
                    <p><strong>Goal:</strong> <span id="profile-goal"></span></p>
                    <p><strong>Slot:</strong> <span id="profile-slot"></span></p>
                </div>
                <div class="recent-activity">
                    <p><strong>Recent Activity:</strong></p>
                    <ul id="profile-recent" style="margin: 0; padding-left: 20px;"></ul>
                </div>
            </div>
            <div class="modal-footer action-buttons">
                <button class="btn" id="profile-attendance-btn"><span class="btn-text">Mark Attendance</span></button>
                <button class="btn" id="profile-history-btn"><span class="btn-text">View History</span></button>
                <button class="btn" id="profile-test-btn"><span class="btn-text">Start Fitness Test</span></button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="forcePasswordChangeModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Create Your New Password</h3>
            </div>
            <div class="modal-body">
                <p>Welcome! For your security, you must create a new password for your account.</p>
                <form id="setPasswordForm">
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New Password (min. 6 characters)</label>
                        <input type="password" class="form-control" id="newPassword" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><span class="btn-text">Set New Password</span></button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

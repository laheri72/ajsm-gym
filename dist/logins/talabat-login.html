<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - FitTracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/favicon-DxDcT4vJ.png" type="image/png">
  <link rel="stylesheet" crossorigin href="/assets/style1-DDfqmuTs.css">
</head>

<body>
  <div class="login-container" style="background-image: url('/assets/ChatGPT%20Image%20Apr%2029_%202025_%2004_11_28%20PM-Dly3w1bS.png');">

    <div class="login-form">
      <h1>Student Login</h1>
      <p>Log in to track your progress</p>

      <form id="loginForm">
          <div class="form-group">
              <label for="trNumber">TR Number</label>
              <input type="text" id="trNumber" required>
          </div>
          <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" required>
          </div>
          <button type="submit" class="login-btn">Login</button>
      </form>

      <a href="../homepage.html" class="return-link">Return to Main Page</a>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const tr = document.getElementById('trNumber').value.trim();
    const password = document.getElementById('password').value; // Get the password value

    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });

    Toast.fire({
        icon: 'info',
        title: '🔃 Authenticating...'
    });

    try {
        const response = await fetch('/api/student-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            // Send both the TR and the password
            body: JSON.stringify({ tr: tr, password: password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            Toast.fire({
                icon: 'success',
                title: '✅ Login successful'
            });

            setTimeout(() => {
                window.location.href = '../student/student-dashboard.html';
            }, 700);
        } else {
            Swal.fire('Login Failed', data.message || 'Invalid TR or password.', 'error');
        }
    } catch (error) {
        console.error('Login error:', error);
        Swal.fire('Error', 'Server error. Please try again later.', 'error');
    }
});
</script>



</body>
</html>

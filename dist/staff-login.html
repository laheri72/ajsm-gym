<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - FitTracker</title>
  <link rel="icon" href="/assets/favicon-DxDcT4vJ.png" type="image/png">
  <link rel="stylesheet" crossorigin href="/assets/style1-DZWH2HdT.css">
</head>

<body>
  <div class="login-container" style="background-image: url('/assets/staff%20final-mQ960Uai.jpg');">

    <div class="login-form">
      <h1>Staff Login</h1>
      <p>Please enter your staff credentials</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="login-btn">Login</button>
      </form>

      <a href="homepage.html" class="return-link">Return to Main Page</a>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    // ✅ Show a toast immediately
    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });

    Toast.fire({
        icon: 'info',
        title: '👤 Staff member session started...'
    });

    try {
        const response = await fetch('/api/staff-login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include', // important for session cookie
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
            localStorage.setItem('staffUser', data.username);
            localStorage.setItem('branch', data.Branch);
            localStorage.setItem('gender', data.Gender);
            localStorage.setItem('role', data.role);


            // Optional: second toast for success (or skip)
            Toast.fire({
                icon: 'success',
                title: '✅ Login successful'
            });

            // Delay for visibility
            setTimeout(() => {
                window.location.href = "staff/overview.html";
            }, 700);

        } else {
            Swal.fire('Login Failed', data.message || 'Invalid credentials.', 'error');
        }

    } catch (error) {
        console.error('Error during login:', error);
        Swal.fire('Error', 'Server error. Please try again later.', 'error');
    }
});
</script>



    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitVerse - The Future of Fitness Blogging</title>
    <link rel="icon" href="/assets/favicon-DxDcT4vJ.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="style.css" />
    <style>
      /* --- Root Variables for Theming --- */
:root {
    --primary-color: #007BFF;
    --primary-hover: #0056b3;
    --background-color: #f4f7f9;
    --surface-color: #ffffff;
    --text-color: #333;
    --subtle-text-color: #6c757d;
    --border-color: #dee2e6;
    --shadow-color: rgba(0, 0, 0, 0.08);
    --font-family: 'Inter', sans-serif;
}

[data-theme="dark"] {
    --primary-color: #0099ff;
    --primary-hover: #33abff;
    --background-color: #121212;
    --surface-color: #1e1e1e;
    --text-color: #e0e0e0;
    --subtle-text-color: #a0a0a0;
    --border-color: #333;
    --shadow-color: rgba(0, 0, 0, 0.25);
}

/* --- General Styles --- */
*, *::before, *::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: var(--font-family);
    background-color: var(--background-color);
    color: var(--text-color);
    line-height: 1.6;
    transition: background-color 0.3s, color 0.3s;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
}

/* --- Header --- */
.site-header {
    background: var(--surface-color);
    padding: 20px 0;
    border-bottom: 1px solid var(--border-color);
    box-shadow: 0 2px 5px var(--shadow-color);
    transition: background-color 0.3s, border-color 0.3s;
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.site-header h1 {
    margin: 0;
    font-size: 2rem;
    color: var(--primary-color);
}

.site-header p {
    margin: 0;
    color: var(--subtle-text-color);
}

.back-home-btn {
    text-decoration: none;
    color: var(--primary-color);
    background-color: transparent;
    border: 2px solid var(--primary-color);
    padding: 8px 16px;
    border-radius: 50px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.back-home-btn:hover {
    background-color: var(--primary-color);
    color: white;
}

/* --- Navigation & Content --- */
.content-nav {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 40px 0 20px;
    border-bottom: 1px solid var(--border-color);
}

.nav-link {
    padding: 10px 15px;
    text-decoration: none;
    color: var(--subtle-text-color);
    font-weight: 600;
    border-bottom: 3px solid transparent;
    transition: all 0.3s ease;
}

.nav-link.active {
    color: var(--primary-color);
    border-bottom-color: var(--primary-color);
}

#theme-toggle {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border-color);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.3s ease;
}
#theme-toggle:hover {
    transform: rotate(15deg) scale(1.1);
}

.content-section {
    display: none;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
}

.content-section.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.content-section h2 {
    font-size: 2.2rem;
    margin-bottom: 8px;
}
.content-section p {
    color: var(--subtle-text-color);
    max-width: 700px;
    margin-bottom: 30px;
}


/* --- Newsletter Iframe --- */
.iframe-container {
    position: relative;
    padding-bottom: 65%; /* Aspect ratio */
    height: 0;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 8px 25px var(--shadow-color);
}
.iframe-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

/* --- Blog Grid & Cards --- */
.blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 30px;
}

.blog-post {
    background: var(--surface-color);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px var(--shadow-color);
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
}

.blog-post:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 25px var(--shadow-color);
}

.post-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.post-content {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.post-content h3 {
    margin: 0 0 10px;
    font-size: 1.4rem;
    color: var(--text-color);
}

.post-date {
    font-size: 0.9rem;
    color: var(--subtle-text-color);
    margin-bottom: 15px;
}

.post-excerpt {
    margin-bottom: 20px;
    flex-grow: 1;
}

.read-more-btn {
    display: inline-block;
    text-decoration: none;
    padding: 10px 20px;
    background-color: var(--primary-color);
    color: white;
    border-radius: 50px;
    font-weight: 600;
    text-align: center;
    transition: background-color 0.3s;
}

.read-more-btn:hover {
    background-color: var(--primary-hover);
}

/* --- Responsive Design --- */
@media (max-width: 600px) {
    .header-content {
        flex-direction: column;
        gap: 15px;
        text-align: center;
    }
    .content-nav {
        flex-wrap: wrap;
    }
    #theme-toggle {
        margin-left: 0;
    }
    .blog-grid {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <div class="logo-area">
                <h1>FitVerse</h1>
                <p>Al Jamea Tus Saifiyah (Marol) Gymnasium</p>
            </div>
            <a class="back-home-btn" href="homepage.html">← Back to Main</a>
        </div>
    </header>

    <main class="container">
        <nav class="content-nav">
            <a href="#newsletter" class="nav-link active">📰 Newsletter</a>
            <a href="#blogs" class="nav-link">✍️ Blogs</a>
            <button id="theme-toggle" title="Toggle dark mode">☀️</button>
        </nav>

        <div class="content-wrapper">
            <section id="newsletter" class="content-section active">
                <h2>Monthly Insights</h2>
                <p>Explore our latest updates and fitness tips in a beautiful flipbook format.</p>
                <div class="iframe-container">
                    <iframe src="https://heyzine.com/flip-book/dbf1603872.html" allowfullscreen loading="lazy"></iframe>
                </div>
            </section>

            <section id="blogs" class="content-section">
                <h2>Latest Articles</h2>
                <p>Stay informed with our expert advice on training, nutrition, and wellness.</p>
                <div id="blog-posts-container" class="blog-grid">
                    </div>
            </section>
        </div>
    </main>
    <script>
      document.addEventListener('DOMContentLoaded', () => {

    // --- Data for Blog Posts (Easy to update!) ---
    const blogPostsData = [
        {
            title: "5 Essential Tips for Workout Recovery",
            date: "September 10, 2025",
            excerpt: "Proper recovery is as crucial as the workout itself. Learn how to optimize your recovery time for maximum gains.",
            imageUrl: "https://images.unsplash.com/photo-1549476464-373922115993?ixlib=rb-4.0.3&q=85&fm=jpg&crop=entropy&cs=srgb&w=600",
            readMoreUrl: "https://www.muscleandfitness.com/workouts/workout-tips/10-best-ways-recover-after-tough-workout/"
        },
        {
            title: "Fueling Your Fire: Nutrition for Muscle Growth",
            date: "September 3, 2025",
            excerpt: "What you eat plays a massive role in your fitness journey. Discover the best foods for building lean muscle.",
            imageUrl: "https://images.unsplash.com/photo-1543353071-873f6b64a67d?ixlib=rb-4.0.3&q=85&fm=jpg&crop=entropy&cs=srgb&w=600",
            readMoreUrl: "https://www.americansportandfitness.com/blogs/fitness-blog/nutrition-for-building-muscle-a-complete-guide"
        },
        {
            title: "Introducing Our New State-of-the-Art Equipment",
            date: "August 25, 2025",
            excerpt: "We've upgraded our facility with the latest gear to help you crush your goals. Come check out the exciting additions!",
            imageUrl: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?ixlib=rb-4.0.3&q=85&fm=jpg&crop=entropy&cs=srgb&w=600",
            readMoreUrl: "#" // Link to a local page or modal
        }
    ];

    // --- Function to Render Blog Posts ---
    const renderBlogPosts = () => {
        const container = document.getElementById('blog-posts-container');
        if (!container) return;
        
        container.innerHTML = blogPostsData.map(post => `
            <article class="blog-post">
                <img src="${post.imageUrl}" alt="${post.title}" class="post-image" loading="lazy">
                <div class="post-content">
                    <h3>${post.title}</h3>
                    <p class="post-date">Posted on ${post.date}</p>
                    <p class="post-excerpt">${post.excerpt}</p>
                    <a href="${post.readMoreUrl}" target="_blank" rel="noopener noreferrer" class="read-more-btn">Read More</a>
                </div>
            </article>
        `).join('');
    };

    // --- Navigation Logic ---
    const navLinks = document.querySelectorAll('.nav-link');
    const contentSections = document.querySelectorAll('.content-section');

    navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const targetId = link.getAttribute('href');

            // Update active state for links
            navLinks.forEach(navLink => navLink.classList.remove('active'));
            link.classList.add('active');

            // Show the target content section
            contentSections.forEach(section => {
                if (`#${section.id}` === targetId) {
                    section.classList.add('active');
                } else {
                    section.classList.remove('active');
                }
            });
        });
    });

    // --- Theme (Dark/Light Mode) Toggle ---
    const themeToggle = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'light';

    document.documentElement.setAttribute('data-theme', currentTheme);
    themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

    themeToggle.addEventListener('click', () => {
        let newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });

    // --- Initializations ---
    renderBlogPosts();

    Swal.fire({
        title: 'Welcome to FitVerse!',
        text: 'Your daily dose of fitness insights starts here 🏋️',
        icon: 'success',
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 2500,
        timerProgressBar: true
    });
});
    </script>

</body>
</html>

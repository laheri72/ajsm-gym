name: Release and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  pull-requests: read

jobs:
  verify:
    name: Verify tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run build

  # ─── 1. AUTOMATED SEMANTIC VERSIONING & GITHUB RELEASE ──────────────────────
  release:
    name: Create GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
      changelog: ${{ steps.bump_version.outputs.changelog }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Semantic Version & Tag
        id: bump_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          initial_version: 1.0.0
          release_branches: main
          create_annotated_tag: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.bump_version.outputs.new_tag != ''
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }}
          name: Release ${{ steps.bump_version.outputs.new_tag }}
          body: ${{ steps.bump_version.outputs.changelog }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 2. GITHUB ENVIRONMENT & DEPLOYMENT TRACKING (100% FREE) ────────────────
  deploy:
    name: Verify Production Commit
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
      url: https://ajsm-gym.onrender.com
    steps:
      - name: Verify Live Service & Record Deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 45); do
            LIVE_COMMIT=$(curl -fsS --max-time 15 https://ajsm-gym.onrender.com/api/version | jq -r '.commit // empty') || LIVE_COMMIT=""
            if [ "$LIVE_COMMIT" = "$EXPECTED_COMMIT" ]; then
              echo "Production is serving commit $LIVE_COMMIT"
              exit 0
            fi
            echo "Waiting for production commit $EXPECTED_COMMIT (attempt $attempt/45, live: ${LIVE_COMMIT:-unavailable})"
            sleep 20
          done
          echo "Production did not serve the expected commit within 15 minutes."
          exit 1

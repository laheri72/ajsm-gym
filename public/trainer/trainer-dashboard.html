<!-- Student Mini Profile Modal -->
<div class="modal fade mini-profile-modal" id="studentMiniProfileModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Student Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="profile-info">
                    <p><strong>Name:</strong> <span id="profile-name"></span></p>
                    <p><strong>TR:</strong> <span id="profile-tr"></span></p>
                    <p><strong>Goal:</strong> <span id="profile-goal"></span></p>
                    <p><strong>Slot:</strong> <span id="profile-slot"></span></p>
                </div>
                <!-- Today's Plan Section -->
                <div class="today-plan-section" style="margin-top: 15px; padding: 12px; background: rgba(var(--primary-rgb), 0.1); border-radius: 10px; border-left: 4px solid var(--primary-color);">
                    <p style="margin-bottom: 8px;"><strong><i class="fas fa-calendar-day"></i> Today's Planned Workout:</strong></p>
                    <div id="profile-today-plan" style="font-size: 0.95rem; line-height: 1.4; color: var(--text-color);">
                        <span class="text-muted italic">Loading plan...</span>
                    </div>
                </div>
                <div class="recent-activity">
                    <p><strong>Recent Activity:</strong></p>
                    <ul id="profile-recent" style="margin: 0; padding-left: 20px;"></ul>
                </div>
            </div>
            <div class="modal-footer action-buttons">
                <button class="btn" id="profile-attendance-btn"><span class="btn-text">Mark Attendance</span></button>
                <button class="btn" id="profile-history-btn"><span class="btn-text">View History</span></button>
                <button class="btn" id="profile-test-btn"><span class="btn-text">Start Fitness Test</span></button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade security-modal" id="forcePasswordChangeModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div class="security-modal-badge">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h4 class="modal-title">Set New Password</h4>
                <p class="security-modal-subtitle">Welcome! For your account security, please create a new password to continue.</p>
            </div>
            <div class="modal-body">
                <form id="setPasswordForm" novalidate>
                    <div class="security-form-group">
                        <label for="newPassword" class="security-form-label">New Password</label>
                        <div class="security-input-wrapper">
                            <i class="bi bi-lock input-icon-left"></i>
                            <input type="password" class="security-input" id="newPassword" placeholder="Min. 6 characters" autocomplete="new-password" required minlength="6">
                            <button type="button" class="toggle-password-btn" title="Toggle password visibility" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="password-requirements">
                            <span class="req-pill" id="lengthReqPill"><i class="bi bi-circle me-1"></i> Min. 6 characters</span>
                        </div>
                    </div>

                    <div class="security-form-group">
                        <label for="confirmPassword" class="security-form-label">Confirm New Password</label>
                        <div class="security-input-wrapper">
                            <i class="bi bi-shield-check input-icon-left"></i>
                            <input type="password" class="security-input" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" required>
                            <button type="button" class="toggle-password-btn" title="Toggle password visibility" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="password-requirements">
                            <span class="req-pill" id="matchReqPill"><i class="bi bi-circle me-1"></i> Passwords match</span>
                        </div>
                    </div>

                    <button type="submit" class="btn security-btn-primary w-100" id="setPasswordBtn">
                        <span class="button-text"><i class="bi bi-shield-check me-1"></i> Set New Password</span>
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

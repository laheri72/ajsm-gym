    <div class="container-fluid p-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Evaluation Audit Log</h1>
            <a href="admin.html" class="btn btn-outline-primary" id="btnAdminBack">

                <i class="bi bi-arrow-left"></i> Back 
            </a>
        </div>
        <p class="mb-4">
            A complete, filterable log of all comments submitted by all evaluators in your branch.
        </p>

<div class="row">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h4 class="h5 mb-3"><i class="bi bi-gender-male"></i> Talabat Batches Overview</h4>
                        
                        <div id="male-batch-cards-container" class="batch-cards-grid recent-batches-grid">
                            <div class="loader-cell"><div class="loader"></div></div>
                        </div>

                        <div class="accordion admin-batch-accordion mt-3" id="male-older-batches-accordion" style="display: none;">
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-male-older" aria-expanded="false">
                                        View Older Batches (<span id="male-older-batch-count">0</span>)
                                    </button>
                                </h2>
                                <div id="collapse-male-older" class="accordion-collapse collapse" data-bs-parent="#male-older-batches-accordion">
                                    <div class="accordion-body">
                                        <div id="male-older-batch-cards-container" class="batch-cards-grid older-batches-grid">
                                            </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h4 class="h5 mb-3"><i class="bi bi-gender-female"></i> Talebaat Batches Overview</h4>
                        
                        <div id="female-batch-cards-container" class="batch-cards-grid recent-batches-grid">
                            <div class="loader-cell"><div class="loader"></div></div>
                        </div>

                        <div class="accordion admin-batch-accordion mt-3" id="female-older-batches-accordion" style="display: none;">
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-female-older" aria-expanded="false">
                                        View Older Batches (<span id="female-older-batch-count">0</span>)
                                    </button>
                                </h2>
                                <div id="collapse-female-older" class="accordion-collapse collapse" data-bs-parent="#female-older-batches-accordion">
                                    <div class="accordion-body">
                                        <div id="female-older-batch-cards-container" class="batch-cards-grid older-batches-grid">
                                            </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <ul class="nav nav-tabs" id="genderTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="male-tab" data-bs-toggle="tab"
                        data-bs-target="#male-log" type="button" role="tab">
                    <i class="bi bi-gender-male"></i> Talabat
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="female-tab" data-bs-toggle="tab"
                        data-bs-target="#female-log" type="button" role="tab">
                    <i class="bi bi-gender-female"></i> Talebaat
                </button>
            </li>
        </ul>

        <div class="tab-content" id="genderTabContent">

            <div class="tab-pane fade show active" id="male-log" role="tabpanel">
                
                <div class="card shadow-sm border-0 filter-row-card">
                    <div class="card-body">
                        <div class="row g-2" id="male-filters">
                            </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table id="maleLogTable" class="table table-striped table-hover" style="width:100%">
                                <thead>
                                    <tr>
                                        <th>Evaluator</th>
                                        <th>Category</th>
                                        <th>TR</th>
                                        <th>Student Name</th>
                                        <th>Batch</th>
                                        <th>Remark</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="female-log" role="tabpanel" aria-labelledby="female-tab">

                <div class="card shadow-sm border-0 filter-row-card">
                    <div class="card-body">
                        <div class="row g-2" id="female-filters">
                            </div>
                    </div>
                </div>
                
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table id="femaleLogTable" class="table table-striped table-hover" style="width:100%">
                                <thead>
                                    <tr>
                                        <th>Evaluator</th>
                                        <th>Category</th>
                                        <th>TR</th>
                                        <th>Student Name</th>
                                        <th>Batch</th>
                                        <th>Remark</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

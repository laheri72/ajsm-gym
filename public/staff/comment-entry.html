<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Evaluation</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/evaluation.css">
</head>
<body>
    <div class="dashboard-container">
        
        <header class="app-header-simple">
            <div class="brand">
                <a href="evaluation.html">FitTracker</a>
            </div>
            <nav class="navbar-simple">
                <a href="#" id="logoutLink">Logout</a>
            </nav>
        </header>

        <main class="main-content">
           <div class="content">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="evaluation.html" class="btn btn-secondary">&larr; Back to Dashboard</a>
                    <h2 class="h4 mb-0" id="page-title">Loading Evaluation...</h2>
                </div>

                <section id="student-info-anchor" class="card mb-4">
                    <div class="loader-cell"><div class="loader"></div></div>
                    </section>

                <section id="comment-form-card" class="card">
                    <form id="commentEntryForm">
                        <input type="hidden" id="commentTestLog" name="TestLog">
                        
                        <div class="form-group mb-3">
                            <label for="commentNutritionNotes" class="form-label h5">Nutrition Notes</label>
                            <textarea class="form-control" id="commentNutritionNotes" name="NutritionNotes" rows="6" placeholder="Enter nutritionist comments..." required></textarea>
                        </div>

                        <div class="form-group mb-3">
                            <label for="commentHealthNotes" class="form-label h5">Health / Issues Notes</label>
                            <textarea class="form-control" id="commentHealthNotes" name="HealthNotes" rows="6" placeholder="Enter notes on health or physical issues..." required></textarea>
                        </div>

                        <div class="form-group mb-4">
                            <label for="commentRecommendations" class="form-label h5">Further Recommendations</label>
                            <textarea class="form-control" id="commentRecommendations" name="Recommendations" rows="6" placeholder="Enter further recommendations..." required></textarea>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-primary" id="saveBtn">
                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                Save and Stay
                            </button>

                            <button type="button" class="btn btn-success" id="saveAndNextBtn">
                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                Save & Continue &rarr;
                            </button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <div class="modal fade" id="forcePasswordChangeModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/comment-entry.js"></script>
</body>
</html>

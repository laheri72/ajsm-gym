<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Evaluation</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/evaluation.css">
</head>
<body>
    <div class="dashboard-container">
        
        <header class="app-header-simple">
            <div class="brand">
                <a href="evaluation.html">FitTracker</a>
            </div>
            <nav class="navbar-simple">
                <span class="navbar-username" id="evaluator-username-display">Loading...</span>
                <a href="#" id="logoutLink">Logout</a>
            </nav>
        </header>

        <main class="main-content">
           <div class="content">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="evaluation.html" class="btn btn-secondary btn-sm">&larr; Back to Dashboard</a>
                    <h2 class="h4 mb-0" id="page-title">Loading Evaluation...</h2>
                </div>

                <section id="student-info-anchor" class="card mb-4">
                    <div class="loader-cell"><div class="loader"></div></div>
                </section>
                    
                <section id="historical-data-container" class="mb-4">
                    <div class="loader-cell"><div class="loader"></div></div>
                </section>

                <section id="comment-form-card" class="card">
                    <form id="commentEntryForm">
                        <input type="hidden" id="commentTestLog" name="TestLog">
                        
                        <div class="form-group mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="commentNutritionNotes" class="form-label h5">Nutrition Notes</label>
                                <button type="button" class="btn btn-primary btn-sm save-comment-btn" id="saveNutritionBtn">
                                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                    <span class="button-text">Save</span>
                                </button>
                            </div>
                            <span class="comment-meta-data" id="metaNutrition"></span>
                            <textarea class="form-control mt-1" id="commentNutritionNotes" name="NutritionNotes" rows="6" placeholder="Enter nutritionist comments..."></textarea>
                        </div>

                        <div class="form-group mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="commentHealthNotes" class="form-label h5">Health / Issues Notes</label>
                                <button type="button" class="btn btn-primary btn-sm save-comment-btn" id="saveHealthBtn">
                                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                    <span class="button-text">Save</span>
                                </button>
                            </div>
                            <span class="comment-meta-data" id="metaHealth"></span>
                            <textarea class="form-control mt-1" id="commentHealthNotes" name="HealthNotes" rows="6" placeholder="Enter notes on health or physical issues..."></textarea>
                        </div>

                        <div class="form-group mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="commentRecommendations" class="form-label h5">Further Recommendations</label>
                                <button type="button" class="btn btn-primary btn-sm save-comment-btn" id="saveRecsBtn">
                                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                    <span class="button-text">Save</span>
                                </button>
                            </div>
                            <span class="comment-meta-data" id="metaRecommendations"></span>
                            <textarea class="form-control mt-1" id="commentRecommendations" name="Recommendations" rows="6" placeholder="Enter further recommendations..."></textarea>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="evaluation.html" class="btn btn-secondary">&larr; Back to Dashboard</a>
                            <button type="button" class="btn btn-success" id="continueNextBtn">
                                Continue to Next Record &rarr;
                            </button>
                        </div>
                    </form>
                </section>

            </div>
        </main>
    </div>

    <div class="modal fade" id="forcePasswordChangeModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/comment-entry.js"></script>
</body>
</html>

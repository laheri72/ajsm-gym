<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Tab</title> <link rel="icon" href="images/favicon.png" type="image/png">
    
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard">
        <div class="navbar">
            <a href="overview.html" id="tab-overview">📊 Overview</a>
            <a href="entry.html" id="tab-entry">Slot Entry</a>
            <a href="admin.html" id="tab-admin" style="display: none;">👑 Admin Panel</a>
            <a href="records.html" id="tab-record">Active Students</a>
            <a href="progress.html" id="tab-Progress">Track Progress</a>
            <a href="test.html" id="tab-test" style="display: none;">Fitness Test</a>
            <a href="attendance.html" id="tab-attendance">Attendance</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
      
        <div class="content">

 <section id="Admin-base" style="padding: 20px;">


        <section class="card mt-4 p-3">
  <h2>👑 Role Management Panel</h2>
  <p id="adminBranchInfo">
  Manage users (staff/trainers) within <span id="branch-name" style="font-weight: bold; text-transform: uppercase; font-size: 1.2rem;"></span> branch.
</p>


  <div style="overflow-x: auto;">
  <!-- Table (read-only) -->
  <table id="adminUserTable" border="1" cellspacing="0" cellpadding="5">
    <thead>
      <tr>
        <th>Username</th>
        <th>Gender</th>
        <th>Role</th>
         <th>Action</th> 
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  </div>
  <!-- Add New User -->
  <h3>Add New User</h3>
  <form id="adminAddForm" class="form-group">
    <input type="text" placeholder="Username" id="newUsername" required />
    <input type="text" placeholder="Password" id="newPassword" required />
    <select id="newGender">
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
    <select id="newRole">
      <option value="Trainer">Trainer</option>
      <option value="Staff">Staff</option>
    </select>
    <button type="submit" class="btn btn-success mb-3">Add User</button>
  </form>
  </section>


  <section id="inactive-student-record" class="card">
  <div class="container mt-5">
    <h2>Inactive Students (Admin View)</h2>
    <div style="overflow-x: auto;">
      <table id="inactiveStudentTable">
        <thead>
          <tr>
            <th>Tr No</th>
            <th>Name</th>
            <th>Darajah</th>
            <th>Preferred Goal</th>
            <th>Slot</th>
            <th>Activate</th> 
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>

</section>


            </div>
    </div>  

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/auth.js"></script>  <script src="js/admin.js"></script> </body>
</html>

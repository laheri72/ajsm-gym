<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Test - FitTracker</title>
  <link rel="stylesheet" href="style1.css">
  <link rel="icon" href="images/favicon.png" type="image/png">
</head>

<body>
  <div class="login-container" style="background-image: url('images/fitness login.jpg');">

    <div class="login-form">
      <h1>Fitness Test</h1>
      <p>Enter your credentials to begin the test</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">TR Number</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label for="password">ITS Number</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="login-btn">Begin Test</button>
      </form>

      <a href="homepage.html" class="return-link">Return to Main Page</a>
    </div>

  </div>
 
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    // ✅ Show a quick Toast immediately
    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });

    Toast.fire({
        icon: 'info',
        title: '🔄 Starting session...'
    });

    try {
        const res = await fetch('/api/test-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
            // Optional: Show success toast (or just redirect)
            Toast.fire({
                icon: 'success',
                title: '✅ Session started'
            });

            // Delay slightly so user sees the success message
            setTimeout(() => {
                window.location.href = '/fitness-test.html';
            }, 700);

        } else {
            Swal.fire('Login Failed', data.message || 'Invalid TR or password.', 'error');
        }

    } catch (err) {
        Swal.fire('Error', 'Something went wrong.', 'error');
        console.error(err);
    }
});

</script>


</body>
</html>

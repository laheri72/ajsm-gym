  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Oswald", sans-serif;
      scroll-behavior: smooth;
    }

    /* BACKGROUND */
    .background-container {
      width: 100%;
      height: 100vh;
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: url('/images/optimized/background_intro.webp');
      background-size: cover;
      background-position: center;
    }

    .text-overlay {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      width: 90%;
      transition: opacity 1s ease, transform 1s ease;
    }

    .title h1 {
      font-size: 3rem;
      font-weight: bold;
      color: white;
      margin: 0;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }

    .tagline {
      margin-top: 10px;
      font-size: 1.5rem;
      color: #eee;
      opacity: 0;
      animation: fadeInTagline 1.5s ease 1s forwards;
    }

    .gym-splash {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
      transition: opacity 1s ease;
      opacity: 1;
    }

    .gym-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .image-container {
      display: flex;
      align-items: center;
      gap: 30px;
      transition: transform 1s ease, opacity 1s ease;
    }

    .logo-image {
      width: 150px;
      opacity: 0;
      animation: logo-animation 1.5s ease forwards;
    }

    .fade-elements {
      opacity: 0;
      transform: scale(1.2);
    }

    .skip-button {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid #fff;
      color: #fff;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      transition: background 0.3s ease;
      z-index: 100;
    }

    .skip-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    @keyframes logo-animation {
      from {
        opacity: 0;
        transform: scale(0.5);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeInTagline {
      to {
        opacity: 1;
      }
    }
  </style>
</head>

  <div class="background-container"></div>

  <div class="text-overlay" id="textOverlay">
    <div class="title">
      <h1>Welcome to FitTracker</h1>
    </div>
    <div class="tagline">Strength • Discipline • Power</div>
  </div>

  <div class="gym-splash" id="splash">
    <div class="image-container" id="imageContainer">
      <picture>
        <source srcset="/images/optimized/logo.webp" type="image/webp">
        <img src="images/Unted.png" alt="University Logo" class="logo-image" id="utedImage" loading="lazy">
      </picture>
    </div>
    <button class="skip-button" onclick="skipIntro()">Skip Intro</button>
  </div>

  <script>
    const autoRedirect = setTimeout(startTransition, 4000);
    function skipIntro() { clearTimeout(autoRedirect); startTransition(); }

    function startTransition() {
      document.getElementById('splash').classList.add('fade-out');
      document.getElementById('imageContainer').classList.add('fade-elements');
      document.getElementById('textOverlay').classList.add('fade-elements');
      setTimeout(() => { window.location.href = "homepage.html"; }, 1000);
    }
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - FitTracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style1.min.css">
  <link rel="icon" href="../images/favicon.png" type="image/png">
</head>

<body>
  <div class="login-container" style="background-image: url('/images/ChatGPT Image Apr 29, 2025, 04_11_28 PM.png');">

    <div class="login-form">
      <h1>Student Login</h1>
      <p>Log in to track your progress</p>

      <form id="loginForm">
          <div class="form-group">
              <label for="trNumber">TR Number</label>
              <input type="text" id="trNumber" required>
          </div>
          <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" required>
          </div>
          <button type="submit" class="login-btn">Login</button>
      </form>
      <a href="#" id="forgotPasswordLink" class="forgot-link" style="display: none;">Forgot Password?</a>

      <a href="../homepage.html" class="return-link">Return to Main Page</a>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.addEventListener('submit', async function(e) {
    if (e.target.id !== 'loginForm') return; // Ensure we only handle the login form
    
    e.preventDefault();

    const trInput = document.getElementById('trNumber');
    const passwordInput = document.getElementById('password');
    const forgotLink = document.getElementById('forgotPasswordLink');
    
    const tr = trInput.value.trim();
    const password = passwordInput.value;

    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });

    Toast.fire({ icon: 'info', title: '🔃 Authenticating...' });

    try {
        const response = await fetch('/api/student-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tr, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            // On successful login, clear any attempts for this TR
            let attempts = JSON.parse(sessionStorage.getItem('loginAttempts')) || {};
            delete attempts[tr];
            sessionStorage.setItem('loginAttempts', JSON.stringify(attempts));

            Toast.fire({ icon: 'success', title: '✅ Login successful' });
            setTimeout(() => {
                window.location.href = '../student/student-dashboard.html';
            }, 700);
        } else {
            // --- NEW: Handle Failed Login Attempts ---
            let attempts = JSON.parse(sessionStorage.getItem('loginAttempts')) || {};
            attempts[tr] = (attempts[tr] || 0) + 1; // Increment counter for this TR
            sessionStorage.setItem('loginAttempts', JSON.stringify(attempts));

            // Show the "Forgot Password" link after 3 failures
            if (attempts[tr] >= 3) {
                forgotLink.style.display = 'block';
            }
            Swal.fire('Login Failed', data.message || 'Invalid TR or password.', 'error');
        }
    } catch (error) {
        console.error('Login error:', error);
        Swal.fire('Error', 'Server error. Please try again later.', 'error');
    }
});

// --- NEW: Add Click Handler for the Forgot Password Link ---
document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
    e.preventDefault();
    const tr = document.getElementById('trNumber').value.trim();

    if (!tr) {
        Swal.fire('TR Needed', 'Please enter your TR number in the field above before clicking "Forgot Password".', 'warning');
        return;
    }

    const adminEmail = 'sports.marol@jameasaifiyah.edu';
    const subject = `Password Reset Request for TR: ${tr}`;
    const body = `
Dear Admin,

I have forgotten my password. Please reset my account.

My Details:
Name: [Please enter your full name here]
TR Number: ${tr}

Thank you.
    `;

    // Create the mailto link and trigger it
    window.location.href = `mailto:${adminEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
});
</script>



</body>
</html>

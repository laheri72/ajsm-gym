<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Login - FitTracker</title>


<!-- Preload optimized background -->
<link rel="preload" as="image" href="/images/optimized/student_login.webp" />


<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />


<!-- Styles -->
<link rel="stylesheet" href="../css/style1.css" />
<link rel="icon" href="../images/favicon.png" type="image/png" />


<style>
.login-bg-wrapper {
position: fixed;
inset: 0;
width: 100%;
height: 100vh;
z-index: -1;
}
.login-bg-wrapper img {
width: 100%;
height: 100%;
object-fit: cover;
}
</style>
</head>

<body>

    <!-- Optimized WebP Background -->
<div class="login-bg-wrapper">
<picture>
<source srcset="/images/optimized/student_login.webp" type="image/webp" />
<img src="/images/stu_logo.jpg" alt="Student Login Background" loading="eager" />
</picture>
</div>


  <div class="login-container">

    <div class="login-form">
      <h1>Student Login</h1>
      <p>Log in to track your progress</p>

      <form id="loginForm">
          <div class="form-group">
              <label for="trNumber">TR Number</label>
              <input type="text" id="trNumber" required>
          </div>
          <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" required>
          </div>
          <button type="submit" class="login-btn">Login</button>
      </form>
      <a href="#" id="forgotPasswordLink" class="forgot-link" style="display: none;">Forgot Password?</a>

      <a href="../homepage.html" class="return-link">Return to Main Page</a>
    </div>

  </div>

<script src="/assets/js/sweetalert2.all.min.js"></script>
<script>
document.addEventListener('submit', async function(e) {
    if (e.target.id !== 'loginForm') return; // Ensure we only handle the login form
    
    e.preventDefault();

    const trInput = document.getElementById('trNumber');
    const passwordInput = document.getElementById('password');
    const forgotLink = document.getElementById('forgotPasswordLink');
    
    const tr = trInput.value.trim();
    const password = passwordInput.value;

    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });

    Toast.fire({ icon: 'info', title: '🔃 Authenticating...' });

    try {
        const response = await fetch('/api/student-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tr, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            // On successful login, clear any attempts for this TR
            let attempts = JSON.parse(sessionStorage.getItem('loginAttempts')) || {};
            delete attempts[tr];
            sessionStorage.setItem('loginAttempts', JSON.stringify(attempts));

            Toast.fire({ icon: 'success', title: '✅ Login successful' });
            setTimeout(() => {
                window.location.href = '../student/student-dashboard.html';
            }, 700);
        } else {
            // --- NEW: Handle Failed Login Attempts ---
            let attempts = JSON.parse(sessionStorage.getItem('loginAttempts')) || {};
            attempts[tr] = (attempts[tr] || 0) + 1; // Increment counter for this TR
            sessionStorage.setItem('loginAttempts', JSON.stringify(attempts));

            // Show the "Forgot Password" link after 3 failures
            if (attempts[tr] >= 3) {
                forgotLink.style.display = 'block';
            }
            Swal.fire('Login Failed', data.message || 'Invalid TR or password.', 'error');
        }
    } catch (error) {
        console.error('Login error:', error);
        Swal.fire('Error', 'Server error. Please try again later.', 'error');
    }
});

// Replace your existing 'forgotPasswordLink' event listener with this one

document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
    e.preventDefault();
    const tr = document.getElementById('trNumber').value.trim();

    if (!tr) {
        Swal.fire('TR Needed', 'Please enter your TR number in the field above before clicking "Forgot Password".', 'warning');
        return;
    }

    const adminEmail = 'sports.marol@jameasaifiyah.edu';
    const subject = `Password Reset Request for TR: ${tr}`;
    const body = `Tasleemaat Janab,\n\nI have forgotten my FitTracker Login password. Please reset my Password.\n\nMy Details:\nName: [Please enter your full name here]\nTR Number: ${tr}\n\nShukran.`;
    const mailtoLink = `mailto:${adminEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    Swal.fire({
        title: 'Request Password Reset',
        html: `
            <p style="text-align:left;">Your browser might not have a default email client set up. You can either try to open your email app automatically, or manually copy the details.</p>
            <div style="margin-top:20px; text-align:left;">
                <strong>To:</strong>
                <div class="input-group mb-2">
                    <input type="text" class="form-control" value="${adminEmail}" readonly>
                    <button class="btn btn-outline-secondary" id="copyEmailBtn">Copy</button>
                </div>
                <strong>Message:</strong>
                <textarea class="form-control" rows="6" readonly>${body}</textarea>
                <button class="btn btn-outline-secondary mt-2" id="copyMessageBtn">Copy Message</button>
            </div>
        `,
        showConfirmButton: true,
        confirmButtonText: 'Open Email App',
        showCancelButton: true,
        cancelButtonText: 'Close',
        didOpen: () => {
            // Add click listeners for the copy buttons inside the modal
            const copyEmailBtn = document.getElementById('copyEmailBtn');
            const copyMessageBtn = document.getElementById('copyMessageBtn');

            copyEmailBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(adminEmail);
                copyEmailBtn.textContent = 'Copied!';
            });

            copyMessageBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(body);
                copyMessageBtn.textContent = 'Copied!';
            });
        }
    }).then((result) => {
        // If the user clicks "Open Email App", try to use the mailto link
        if (result.isConfirmed) {
            window.location.href = mailtoLink;
        }
    });
});
</script>



</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fitness Test - FitTracker</title>


<!-- Preload optimized background for faster LCP -->
<link rel="preload" as="image" href="/images/optimized/fitness_login.webp" />


<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />


<link rel="stylesheet" href="../css/style1.css" />
<link rel="icon" href="../images/favicon.png" type="image/png" />


<style>
.login-bg-wrapper { position: fixed; inset: 0; z-index: -1; }
.login-bg-wrapper img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>

<body>

  <!-- Optimized background -->
<div class="login-bg-wrapper">
<picture>
<source srcset="/images/optimized/fitness_login.webp" type="image/webp" />
<img src="/images/fitness login.jpg" alt="Fitness Test Background" loading="eager" />
</picture>
</div>

  <div class="login-container">

    <div class="login-form">
      <h1>Fitness Test</h1>
      <p>Enter your credentials to begin the test</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">TR Number</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label for="password">ITS Number or Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="login-btn">Begin Test</button>
      </form>

      <a href="../homepage.html" class="return-link">Return to Main Page</a>
    </div>

  </div>
 
<script src="/assets/js/sweetalert2.all.min.js"></script>
<script type="module">
document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    // ★★★ REMOVED .trim() from password ★★★
    const password = document.getElementById('password').value;

    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true
    });

    Toast.fire({
        icon: 'info',
        title: '🔄 Starting session...'
    });

    try {
        const res = await fetch('/api/test-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
            credentials: 'include'
        });

        const data = await res.json();

        // ★★★ UPDATED SUCCESS LOGIC ★★★
        if (data.success) {
            // 1. Store the new flag from the API
            sessionStorage.setItem('forcePasswordChange', data.forcePasswordChange);

            Toast.fire({
                icon: 'success',
                title: '✅ Session started'
            });

            // 2. Redirect to the dashboard
            setTimeout(() => {
                window.location.href = '../student/fitness-test.html';
            }, 700);

        } else {
            Swal.fire('Login Failed', data.message || 'Invalid TR or password.', 'error');
        }
        // ★★★ END OF UPDATE ★★★

    } catch (err) {
        Swal.fire('Error', 'Something went wrong.', 'error');
        console.error(err);
    }
});

</script>

</body>
</html>
